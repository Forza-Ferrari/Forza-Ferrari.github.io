<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Forza-Ferrari</title>
  <desc id="desc">World Models, Generative AI and Open Source</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1120" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B16"/>
      <stop offset="0.52" stop-color="#111638"/>
      <stop offset="1" stop-color="#241044"/>
    </linearGradient>
    <linearGradient id="accent" x1="375" y1="95" x2="840" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 145) rotate(180) scale(360 240)">
      <stop stop-color="#7C3AED" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="300" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <circle cx="1020" cy="58" r="96" fill="#22D3EE" fill-opacity="0.08" filter="url(#blur)"/>
    <circle cx="106" cy="260" r="116" fill="#8B5CF6" fill-opacity="0.14" filter="url(#blur)"/>

    <g opacity="0.74">
      <ellipse cx="985" cy="150" rx="164" ry="68" transform="rotate(-17 985 150)" stroke="url(#accent)" stroke-width="1.5"/>
      <ellipse cx="985" cy="150" rx="116" ry="45" transform="rotate(23 985 150)" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <circle cx="985" cy="150" r="31" fill="#10172F" stroke="url(#accent)" stroke-width="2"/>
      <circle cx="985" cy="150" r="10" fill="#22D3EE"/>
      <circle cx="1127" cy="106" r="7" fill="#C084FC"/>
      <circle cx="848" cy="198" r="5" fill="#818CF8"/>
      <circle cx="905" cy="96" r="3" fill="#FFFFFF"/>
    </g>

    <g opacity="0.52" fill="#FFFFFF">
      <circle cx="72" cy="64" r="1.5"/>
      <circle cx="152" cy="98" r="1"/>
      <circle cx="111" cy="192" r="1.5"/>
      <circle cx="1084" cy="245" r="1.5"/>
      <circle cx="770" cy="58" r="1"/>
      <circle cx="689" cy="230" r="1.5"/>
    </g>

    <rect x="76" y="62" width="47" height="4" rx="2" fill="url(#accent)"/>
    <text x="76" y="137" fill="#F8FAFC" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="2">FORZA // FERRARI</text>
    <text x="79" y="180" fill="url(#accent)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="4">WORLD MODELS  ·  GENERATIVE AI  ·  OPEN SOURCE</text>
    <text x="79" y="224" fill="#CBD5E1" fill-opacity="0.72" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" letter-spacing="1.3">BUILDING SYSTEMS THAT LEARN INTERACTIVE WORLDS</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="23.25" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
</svg>
